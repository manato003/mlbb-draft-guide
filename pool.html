<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ピックプール｜MLBB ドラフト資料</title>
<meta name="description" content="チームのメンバーのピックプール（得意なレーンと、熟練度ごとの使えるヒーロー）。">
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --text: #1d1f23; --muted: #5d636e; --line: #e2e0d8;
  --accent: #b4462f; --accent-soft: #f6e6e1; --row: #faf9f6; --link: #1f5fa8;
  --s: #b4462f; --a: #1f5fa8; --b: #5d636e; --ok: #2f7a4f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --surface: #1d2026; --text: #e7e5df; --muted: #9aa0aa; --line: #30343c;
    --accent: #e8836b; --accent-soft: #3a2621; --row: #22252c; --link: #8cb8f0;
    --s: #e8836b; --a: #8cb8f0; --b: #9aa0aa; --ok: #7ccb9a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  font-size: 16px; line-height: 1.75; -webkit-text-size-adjust: 100%;
}
a { color: var(--link); }
[hidden] { display: none !important; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 48px; }
header.hero { padding: 40px 0 8px; }
header.hero .kicker { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 13px; }
header.hero h1 { font-size: clamp(26px, 6vw, 36px); line-height: 1.3; margin: 6px 0 12px; }
nav.pages { display: flex; flex-wrap: wrap; gap: 4px; margin: 14px 0 0; padding: 4px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; width: fit-content; max-width: 100%; }
nav.pages a { padding: 6px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 700; }
nav.pages a:hover { color: var(--text); }
nav.pages a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
header.hero .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.intro { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: 8px; padding: 14px 18px; margin: 20px 0 0; font-size: 15px; }
.intro p { margin: 0 0 6px; } .intro p:last-child { margin: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 20px 0 0; }
.toolbar .status { margin: 0; color: var(--muted); font-size: 14px; flex: 1; min-width: 12em; }
.btn { font: inherit; font-weight: 700; font-size: 15px; padding: 9px 16px; min-height: 44px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, .lane input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.lane-group h2 { font-size: 18px; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
.lane-group h2 .n { color: var(--muted); font-size: 14px; font-weight: 400; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card-head { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
.card-head .who { font-size: 18px; font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.card-head .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
.card-head .btn { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.grade-row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.badge { flex-shrink: 0; width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #fff; margin-top: 4px; }
.badge.S { background: var(--s); } .badge.A { background: var(--a); } .badge.B { background: var(--b); }
.chips { display: flex; flex-wrap: wrap; gap: 6px 12px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
.chips .none { color: var(--muted); font-size: 14px; padding-top: 6px; }
.hi { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 700; object-fit: cover; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; color: var(--muted); margin: 20px 0 0; }
/* 編集 */
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 20px 20px; margin: 20px 0 0; }
.step h2 { font-size: 20px; line-height: 1.4; margin: 18px 0 6px; display: flex; align-items: center; gap: 10px; }
.step h2 .num { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; border-radius: 8px;
  background: var(--accent-soft); color: var(--accent); font-size: 16px; flex-shrink: 0; }
.step .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.field { display: block; font-weight: 700; font-size: 15px; margin: 14px 0 6px; }
input[type="text"] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--text); }
.lanes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.lane { position: relative; }
.lane input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.lane span { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 6px 4px; text-align: center;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-weight: 700; font-size: 15px; cursor: pointer; }
.lane input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.legend { font-size: 13px; color: var(--muted); margin: 0 0 12px; padding: 8px 12px; background: var(--row); border-radius: 8px; }
.legend b { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.hero-btn { font: inherit; text-align: left; display: flex; gap: 8px; align-items: center; padding: 6px 8px; min-height: 52px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); cursor: pointer; position: relative; }
.hero-btn .name { display: block; font-weight: 700; font-size: 14px; line-height: 1.35; }
.hero-btn .stat { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; font-variant-numeric: tabular-nums; }
.hero-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.hero-btn[aria-pressed="true"] .name { color: var(--accent); }
.hero-btn[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 4px; right: 8px; color: var(--accent); font-weight: 700; font-size: 13px; }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; }
.count { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.grade-list { list-style: none; margin: 0; padding: 0; }
.grade-list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.grade-list li:last-child { border-bottom: 0; }
.grade-list .name { font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex-shrink: 0; }
.seg button { font: inherit; font-weight: 700; width: 46px; height: 44px; border: 0; border-right: 1px solid var(--line);
  background: var(--bg); color: var(--muted); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"][data-g="S"] { background: var(--s); color: #fff; }
.seg button[aria-pressed="true"][data-g="A"] { background: var(--a); color: #fff; }
.seg button[aria-pressed="true"][data-g="B"] { background: var(--b); color: #fff; }
.remove { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 4px; cursor: pointer; text-decoration: underline; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.actions .spacer { flex: 1; }
.msg { font-size: 14px; margin: 10px 0 0; min-height: 1.5em; font-weight: 700; }
.msg.ok { color: var(--ok); } .msg.ng { color: var(--accent); }
footer { color: var(--muted); font-size: 13px; padding: 32px 0 0; }
footer p { margin: 0 0 6px; }
@media (max-width: 640px) {
  body { font-size: 15px; }
  header.hero { padding: 24px 0 0; }
  .step { padding: 2px 14px 16px; border-radius: 10px; margin-top: 16px; }
  .lanes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .seg button { width: 42px; }
  .card { padding: 12px 12px; }
}
</style>
</head>
<body data-sealed="1">
<div class="gate" id="gate">
  <form class="gate-box" id="gate-form" autocomplete="off">
    <div class="gate-kicker">TEAM DRAFT GUIDE</div>
    <h1 class="gate-title">チームの合言葉</h1>
    <p class="gate-text">このページはチームの内部資料です。合言葉を入れてください。一度入れると、このブラウザでは次から聞きません。</p>
    <input type="password" id="gate-pass" class="gate-input" aria-label="合言葉" autocomplete="current-password" required>
    <button type="submit" class="gate-btn" id="gate-btn">開く</button>
    <p class="gate-msg" id="gate-msg" aria-live="polite"></p>
  </form>
</div>
<style>
.gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.gate[hidden] { display: none; }
.gate-box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.gate-kicker { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 12px; }
.gate-title { font-size: 22px; margin: 4px 0 8px; }
.gate-text { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.gate-input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
.gate-btn { width: 100%; margin: 10px 0 0; font: inherit; font-weight: 700; padding: 10px; min-height: 44px; border: 0; border-radius: 8px;
  background: var(--accent); color: #fff; cursor: pointer; }
.gate-btn:disabled { opacity: .6; }
.gate-input:focus-visible, .gate-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gate-msg { color: var(--accent); font-size: 14px; font-weight: 700; min-height: 1.5em; margin: 10px 0 0; }
</style>
