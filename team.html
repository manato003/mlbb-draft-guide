<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チームのバンピック案｜MLBB ドラフト資料</title>
<meta name="description" content="自分たちのピックプールと日本のフルパランクの環境に合わせた、チームのバンピック案。">
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --text: #1d1f23; --muted: #5d636e; --line: #e2e0d8;
  --accent: #b4462f; --accent-soft: #f6e6e1; --row: #faf9f6; --link: #1f5fa8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --surface: #1d2026; --text: #e7e5df; --muted: #9aa0aa; --line: #30343c;
    --accent: #e8836b; --accent-soft: #3a2621; --row: #22252c; --link: #8cb8f0;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  font-size: 16px; line-height: 1.8; -webkit-text-size-adjust: 100%;
}
a { color: var(--link); }
.layout { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.layout > * { min-width: 0; }
header.hero { padding: 40px 0 8px; }
header.hero .kicker { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 13px; }
header.hero h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.3; margin: 6px 0 12px; }
header.hero h1:focus { outline: none; }
nav.pages { display: flex; gap: 4px; margin: 14px 0 0; padding: 4px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; width: fit-content; max-width: 100%; }
nav.pages a { padding: 6px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 700; }
nav.pages a:hover { color: var(--text); }
nav.pages a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
header.hero .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.intro { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: 8px; padding: 16px 20px; margin: 20px 0 0; font-size: 15px; }
.intro p { margin: 0 0 8px; } .intro p:last-child { margin: 0; }
nav.toc { font-size: 14px; }
nav.toc details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
nav.toc summary { font-weight: 700; cursor: pointer; }
nav.toc ol { list-style: none; margin: 8px 0 0; padding: 0; }
nav.toc li { margin: 6px 0; }
nav.toc a { color: var(--text); text-decoration: none; }
nav.toc a:hover { color: var(--accent); }
nav.toc ol.sub { margin: 2px 0 4px 30px; }
nav.toc ol.sub a { color: var(--muted); font-size: 13px; }
nav.toc .num, .chapter h2 .num { display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
  font-weight: 700; font-size: 12px; margin-right: 8px; }
main { min-width: 0; }
.chapter { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 20px 20px; margin: 0 0 24px; }
.chapter h2 { font-size: 22px; line-height: 1.4; margin: 20px 0 12px; display: flex; align-items: center; }
.chapter h2 .num { min-width: 30px; height: 30px; font-size: 16px; border-radius: 8px; flex-shrink: 0; }
.chapter h3 { font-size: 18px; margin: 28px 0 8px; padding-top: 16px; border-top: 1px dashed var(--line); }
.chapter p { margin: 10px 0; }
.chapter ul, .chapter ol { padding-left: 1.3em; margin: 8px 0; }
.chapter li { margin: 4px 0; }
.chapter strong { color: var(--text); background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }
.table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.6; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--accent-soft); white-space: nowrap; font-weight: 700; }
tbody tr:nth-child(even) td { background: var(--row); }
tbody tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 700; white-space: nowrap; }
/* 型の表の「ダメージ」の列は短い語なので折り返さない。そのぶん「役割」の列に幅を回す */
td[data-label="ダメージ"] { white-space: nowrap; }
td[data-label="役割"] { min-width: 12em; }
.hchips { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.hchip { display: inline-flex; align-items: center; gap: 8px; }
.hchip img { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
.hchip b { display: block; font-size: 14px; line-height: 1.3; white-space: nowrap; }
.hchip small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; font-weight: 400; white-space: nowrap; }
td:first-child .hchip b { font-weight: 700; }
.hico { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; vertical-align: -6px; }
.hico img { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
.hico.solo { flex-direction: column; align-items: flex-start; gap: 2px; vertical-align: top; }
.hico.solo img { width: 28px; height: 28px; }
td:first-child .hcell { white-space: normal; }
.team-pool { margin: 8px 0 16px; }
.tp-status, .tp-note { color: var(--muted); font-size: 13px; }
.tp-lane { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0 0 10px; background: var(--surface); }
.tp-lane h4 { margin: 0 0 8px; font-size: 15px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.tp-n { color: var(--muted); font-size: 12px; font-weight: 400; }
.tp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 12px 6px; }
.tp-chip { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-width: 0; }
.tp-chip b { font-size: 12px; line-height: 1.3; white-space: nowrap; }
.tp-chip small { color: var(--muted); font-size: 11px; line-height: 1.35; overflow-wrap: anywhere; }
.tp-ic { width: 40px; height: 40px; border-radius: 50%; box-sizing: border-box; border: 2px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; background: var(--row); font-weight: 700; }
.tp-ic.gS { border-color: #b4462f; } .tp-ic.gA { border-color: #1f5fa8; } .tp-ic.gB { border-color: var(--line); }
.sources ol { font-size: 13px; padding-left: 1.6em; word-break: break-all; }
footer { color: var(--muted); font-size: 13px; padding: 8px 0 40px; }
.to-top { position: fixed; right: 16px; bottom: 16px; z-index: 10; width: 48px; height: 48px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
  opacity: 0; visibility: hidden; transform: translateY(8px);
  transition: opacity .2s, transform .2s, visibility 0s .2s; }
.to-top.show { opacity: 1; visibility: visible; transform: none; transition: opacity .2s, transform .2s; }
.to-top:hover { background: var(--accent-soft); }
.to-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .to-top, .to-top.show { transition: none; }
}
@media (max-width: 640px) {
  body { font-size: 15px; line-height: 1.75; }
  .layout { gap: 16px; }
  header.hero { padding: 24px 0 0; }
  .intro { padding: 12px 14px; margin-top: 16px; }
  .chapter { padding: 4px 14px 14px; border-radius: 10px; margin-bottom: 16px; }
  .chapter h2 { font-size: 20px; margin: 16px 0 10px; }
  .chapter h2 .num { min-width: 28px; height: 28px; font-size: 15px; }
  .chapter h3 { font-size: 17px; margin: 22px 0 6px; padding-top: 14px; }
  .chapter ul, .chapter ol { padding-left: 1.2em; }
  /* 表は行ごとのカードにする（列が細く潰れて縦に伸びるのを避ける） */
  .table-wrap.cards { overflow: visible; border: 0; border-radius: 0; }
  .table-wrap.cards table, .table-wrap.cards tbody, .table-wrap.cards tr, .table-wrap.cards td { display: block; width: 100%; }
  .table-wrap.cards thead { display: none; }
  .table-wrap.cards tr { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 0 0 10px; }
  .table-wrap.cards tbody tr:nth-child(even) td { background: transparent; }
  .table-wrap.cards td { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 10px; padding: 7px 12px;
    border-bottom: 1px solid var(--line); }
  .table-wrap.cards td:last-child { border-bottom: 0; }
  .table-wrap.cards td::before { content: attr(data-label); color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.6; padding-top: 2px; }
  .table-wrap.cards td:first-child { display: block; white-space: normal; font-size: 15px; background: var(--accent-soft); }
  .table-wrap.cards tbody tr td:first-child { background: var(--accent-soft); }
  .table-wrap.cards td:first-child::before { content: none; }
  .table-wrap.cards td:empty { display: none; }
  .table-wrap:not(.cards) td:first-child { white-space: normal; min-width: 7em; }
  nav.toc ol.sub { margin-left: 30px; }
  nav.toc li { margin: 8px 0; }
}
@media (min-width: 980px) {
  .layout { grid-template-columns: 260px minmax(0, 1fr); }
  header.hero, .layout > .intro-row { grid-column: 1 / -1; }
  nav.toc { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; }
  nav.toc details { border: 0; background: transparent; padding: 0; }
  nav.toc summary { pointer-events: none; list-style: none; }
  nav.toc summary::-webkit-details-marker { display: none; }
  .chapter { padding: 8px 32px 28px; }
}
</style>
</head>

<div class="gate" id="gate">
  <form class="gate-box" id="gate-form" autocomplete="off">
    <div class="gate-kicker">TEAM DRAFT GUIDE</div>
    <h1 class="gate-title">チームの合言葉</h1>
    <p class="gate-text">このページはチームの内部資料です。合言葉を入れてください。一度入れると、このブラウザでは次から聞きません。</p>
    <input type="password" id="gate-pass" class="gate-input" aria-label="合言葉" autocomplete="current-password" required>
    <button type="submit" class="gate-btn" id="gate-btn">開く</button>
    <p class="gate-msg" id="gate-msg" aria-live="polite"></p>
  </form>
</div>
<style>
.gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.gate[hidden] { display: none; }
.gate-box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.gate-kicker { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 12px; }
.gate-title { font-size: 22px; margin: 4px 0 8px; }
.gate-text { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.gate-input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
.gate-btn { width: 100%; margin: 10px 0 0; font: inherit; font-weight: 700; padding: 10px; min-height: 44px; border: 0; border-radius: 8px;
  background: var(--accent); color: #fff; cursor: pointer; }
.gate-btn:disabled { opacity: .6; }
.gate-input:focus-visible, .gate-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gate-msg { color: var(--accent); font-size: 14px; font-weight: 700; min-height: 1.5em; margin: 10px 0 0; }
</style>

  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

    document.body.innerHTML = body;

    Array.prototype.forEach.call(document.body.querySelectorAll('script'), function (old) {

      Array.prototype.forEach.call(old.attributes, function (a) { s.setAttribute(a.name, a.value); });

      old.parentNode.replaceChild(s, old);
