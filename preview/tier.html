<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【プレビュー】ティア表｜MLBB ドラフト資料</title>
<meta name="description" content="全ヒーローのレーン別ティア表。プロの試合（MPL）を土台に、2.2.23 の変更とランクの数字を加えたもの。">
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --text: #1d1f23; --muted: #5d636e; --line: #e2e0d8;
  --accent: #b4462f; --accent-soft: #f6e6e1; --row: #faf9f6; --link: #1f5fa8;
  --tS: #b4462f; --tA: #c27a12; --tB: #2f7d4f; --tC: #3f6fb0; --tD: #7a7f88;
  --team: #2f7d4f; --team-soft: #e3f1e8; --data: #3f6fb0; --data-soft: #e4ecf7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --surface: #1d2026; --text: #e7e5df; --muted: #9aa0aa; --line: #30343c;
    --accent: #e8836b; --accent-soft: #3a2621; --row: #22252c; --link: #8cb8f0;
    --tS: #e8836b; --tA: #e0a64a; --tB: #6cc08f; --tC: #82a9e3; --tD: #9aa0aa;
    --team: #6cc08f; --team-soft: #1f3328; --data: #82a9e3; --data-soft: #1f2a3b;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --surface: #1d2026; --text: #e7e5df; --muted: #9aa0aa; --line: #30343c;
  --accent: #e8836b; --accent-soft: #3a2621; --row: #22252c; --link: #8cb8f0;
  --tS: #e8836b; --tA: #e0a64a; --tB: #6cc08f; --tC: #82a9e3; --tD: #9aa0aa;
  --team: #6cc08f; --team-soft: #1f3328; --data: #82a9e3; --data-soft: #1f2a3b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
a { color: var(--link); }
button { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
header.hero { padding: 28px 0 4px; }
header.hero .kicker { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 13px; }
nav.pages { display: flex; flex-wrap: wrap; gap: 4px; margin: 12px 0 0; padding: 4px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; width: fit-content; max-width: 100%; }
nav.pages a { padding: 6px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 700; white-space: nowrap; }
nav.pages a:hover { color: var(--text); }
nav.pages a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
header.hero h1 { font-size: clamp(24px, 5vw, 34px); line-height: 1.3; margin: 10px 0 4px; }
header.hero .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.lead { margin: 10px 0 6px; font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); align-items: center; margin: 4px 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
details.how { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; font-size: 13.5px; }
details.how summary { cursor: pointer; font-weight: 700; }
details.how ul { margin: 6px 0; padding-left: 1.3em; }

/* 表 */
.tiers { display: grid; grid-template-columns: 7.2em repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tiers > div { border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-width: 0; }
.tiers > .th { position: sticky; top: 0; z-index: 2; background: var(--surface); border-top: 0; text-align: center; font-size: 13px; font-weight: 800; padding: 8px 2px; color: var(--muted); }
.tiers > .th:first-child, .tiers > .tl { border-left: 0; }
.tiers > .th.corner { border-radius: 12px 0 0 0; }
.tl { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; text-align: center; }
.tl b { font-size: 26px; line-height: 1; color: #fff; width: 1.6em; height: 1.6em; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; }
.tl small { font-size: 10.5px; line-height: 1.3; color: var(--muted); margin-top: 4px; }
.tl.tS b { background: var(--tS); } .tl.tA b { background: var(--tA); } .tl.tB b { background: var(--tB); } .tl.tC b { background: var(--tC); } .tl.tD b { background: var(--tD); }
.cell { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px 2px; padding: 8px 4px; align-content: start; }
.cell.tS { background: color-mix(in srgb, var(--tS) 7%, transparent); }
.cell.tA { background: color-mix(in srgb, var(--tA) 6%, transparent); }
.h { border: 0; background: transparent; padding: 2px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; border-radius: 8px; }
.h:hover { background: var(--row); }
.h:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.h .ic { position: relative; display: block; }
.h img, .h .noimg { width: 40px; height: 40px; border-radius: 50%; display: block; background: var(--row); }
.cell.tD .h img, .cell.tD .h .noimg { width: 34px; height: 34px; }
.h .n { font-size: 11px; line-height: 1.25; text-align: center; overflow-wrap: anywhere; max-width: 100%; }
.mv { position: absolute; right: -5px; top: -4px; min-width: 16px; height: 16px; border-radius: 8px; font-size: 11px; font-weight: 800; line-height: 16px; text-align: center;
  color: #fff; border: 1.5px solid var(--surface); padding: 0 2px; }
.mv.data { background: var(--data); } .mv.user { background: var(--team); }
.dot { display: inline-block; min-width: 16px; height: 16px; border-radius: 8px; color: #fff; font-size: 11px; font-weight: 800; line-height: 16px; text-align: center; padding: 0 2px; }
.dot.data { background: var(--data); } .dot.user { background: var(--team); }
.by { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; white-space: nowrap; }
.by.data { background: var(--data-soft); color: var(--data); } .by.user { background: var(--team-soft); color: var(--team); }

/* 詳細 */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.sheet { padding: 14px 16px 16px; }
.sheet header { display: flex; gap: 10px; align-items: center; }
.sheet header img { width: 56px; height: 56px; border-radius: 50%; }
.sheet h3 { margin: 0; font-size: 19px; }
.sheet h4 { font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
.sheet .close { margin-left: auto; align-self: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.sheet .sub { color: var(--muted); font-size: 12.5px; }
.lt { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 4px 8px; font-size: 13.5px; align-items: baseline; }
.lt .why { color: var(--muted); font-size: 12.5px; }
.tg { display: inline-block; min-width: 1.5em; text-align: center; border-radius: 5px; color: #fff; font-weight: 800; font-size: 12px; padding: 0 4px; }
.tg.S { background: var(--tS); } .tg.A { background: var(--tA); } .tg.B { background: var(--tB); } .tg.C { background: var(--tC); } .tg.D { background: var(--tD); }
.tg.off { background: transparent; color: var(--muted); border: 1px solid var(--line); }
table.nums { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.nums th, table.nums td { border-top: 1px solid var(--line); padding: 3px 4px; text-align: right; white-space: nowrap; }
table.nums th:first-child, table.nums td:first-child { text-align: left; white-space: normal; }
table.nums thead th { color: var(--muted); font-weight: 700; border-top: 0; }
footer { color: var(--muted); font-size: 12px; margin-top: 12px; }

@media (max-width: 760px) {
  .wrap { padding: 0 10px 40px; }
  header.hero { padding-top: 18px; }
  .tiers { grid-template-columns: 2.2em repeat(5, minmax(0, 1fr)); }
  .tl small { display: none; }
  .tl b { font-size: 17px; }
  .tiers > .th { font-size: 11px; padding: 6px 0; }
  .cell { grid-template-columns: minmax(0, 1fr); padding: 6px 1px; gap: 6px 0; }
  .h img, .h .noimg { width: 34px; height: 34px; }
  .cell.tD .h img, .cell.tD .h .noimg { width: 30px; height: 30px; }
  .h .n { font-size: 9.5px; }
  .mv { right: -6px; min-width: 14px; height: 14px; line-height: 14px; font-size: 10px; }
}
</style>
</head>

<div class="gate" id="gate">
  <form class="gate-box" id="gate-form" autocomplete="off">

    <h1 class="gate-title">プレビューの合言葉</h1>

    <input type="password" id="gate-pass" class="gate-input" aria-label="合言葉" autocomplete="current-password" required>
    <button type="submit" class="gate-btn" id="gate-btn">開く</button>
    <p class="gate-msg" id="gate-msg" aria-live="polite"></p>
  </form>
</div>
<style>
.gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.gate[hidden] { display: none; }
.gate-box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.gate-kicker { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 12px; }
.gate-title { font-size: 22px; margin: 4px 0 8px; }
.gate-text { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.gate-input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
.gate-btn { width: 100%; margin: 10px 0 0; font: inherit; font-weight: 700; padding: 10px; min-height: 44px; border: 0; border-radius: 8px;
  background: var(--accent); color: #fff; cursor: pointer; }
.gate-btn:disabled { opacity: .6; }
.gate-input:focus-visible, .gate-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gate-msg { color: var(--accent); font-size: 14px; font-weight: 700; min-height: 1.5em; margin: 10px 0 0; }
</style>

    });
  }
})();
</script>
