<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【プレビュー】ドラフト｜MLBB ドラフト資料</title>
<meta name="description" content="バン・ピックを押して入れると、その時点の候補・避ける組み合わせ・相手への返しが出るドラフトの画面。">
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --text: #1d1f23; --muted: #5d636e; --line: #e2e0d8;
  --accent: #b4462f; --accent-soft: #f6e6e1; --row: #faf9f6; --link: #1f5fa8;
  /* ティア（資料全体でそろえる色） */
  --tS: #b4462f; --tA: #c27a12; --tB: #2f7d4f; --tC: #3f6fb0; --tD: #7a7f88;
  /* 判断の状態 */
  --team: #2f7d4f; --team-soft: #e3f1e8; --proposal: #a86a00; --proposal-soft: #fbefd9; --data: #3f6fb0; --data-soft: #e4ecf7;
  /* 良い・悪い */
  --good: #2f7d4f; --good-soft: #e3f1e8; --bad: #b4462f; --bad-soft: #f6e6e1;
  --blue: #2c63b8; --red: #c23b32;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --surface: #1d2026; --text: #e7e5df; --muted: #9aa0aa; --line: #30343c;
    --accent: #e8836b; --accent-soft: #3a2621; --row: #22252c; --link: #8cb8f0;
    --tS: #e8836b; --tA: #e0a64a; --tB: #6cc08f; --tC: #82a9e3; --tD: #9aa0aa;
    --team: #6cc08f; --team-soft: #1f3328; --proposal: #e0a64a; --proposal-soft: #3a2f1c; --data: #82a9e3; --data-soft: #1f2a3b;
    --good: #6cc08f; --good-soft: #1f3328; --bad: #e8836b; --bad-soft: #3a2621;
    --blue: #7aa7ee; --red: #ef8a80;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
a { color: var(--link); }
button { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
header.hero { padding: 28px 0 4px; }
header.hero .kicker { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 13px; }
nav.pages { display: flex; flex-wrap: wrap; gap: 4px; margin: 12px 0 0; padding: 4px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; width: fit-content; max-width: 100%; }
nav.pages a { padding: 6px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 700; white-space: nowrap; }
nav.pages a:hover { color: var(--text); }
nav.pages a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
header.hero h1 { font-size: clamp(24px, 5vw, 34px); line-height: 1.3; margin: 10px 0 4px; }
header.hero .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 14px; }

/* 盤面（上に貼りつく） */
.board { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button.blue[aria-pressed="true"] { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
.seg button.red[aria-pressed="true"] { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.spacer { flex: 1; }
.rows { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 8px; align-items: center; }
.rows .lab { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.rows .lab.ours { color: var(--blue); } .rows .lab.theirs { color: var(--red); }
.side-red .rows .lab.ours { color: var(--red); } .side-red .rows .lab.theirs { color: var(--blue); }
.slots { display: flex; gap: 4px; flex-wrap: nowrap; min-width: 0; }
.slots.bans .slot { width: 30px; height: 30px; }
.slot { width: 40px; height: 40px; border-radius: 50%; border: 1.5px dashed var(--line); background: var(--surface); padding: 0; position: relative; flex-shrink: 0; cursor: pointer; }
.slot img { width: 100%; height: 100%; border-radius: 50%; display: block; }
.slot.filled { border-style: solid; border-color: transparent; }
.slots.bans .slot.filled img { filter: grayscale(1); opacity: .7; }
.slot.next { border-color: var(--accent); border-style: solid; box-shadow: 0 0 0 2px var(--accent-soft); }
.slot .ln { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); font-size: 10px; color: var(--muted); white-space: nowrap; line-height: 1; }
.slots.picks { padding-bottom: 12px; }
.slots .gap { width: 6px; flex-shrink: 0; }
.turn { margin-top: 8px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.turn .who { padding: 1px 8px; border-radius: 999px; font-size: 12px; }
.turn .who.ours { background: var(--accent-soft); color: var(--accent); }
.turn .who.theirs { background: var(--row); color: var(--muted); border: 1px solid var(--line); }
.turn .force { font-size: 12px; color: var(--muted); font-weight: 400; }

/* 本体 */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 980px) { .grid2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
.card h2 { font-size: 16px; margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h2 small { font-size: 12px; color: var(--muted); font-weight: 400; }
.card.key { border-left: 4px solid var(--accent); }
.card p { margin: 6px 0; }
.note { color: var(--muted); font-size: 12px; }
.tip { background: var(--row); border-radius: 8px; padding: 8px 10px; font-size: 14px; margin: 0 0 10px; }

/* ヒーローの札 */
.hb { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; min-width: 0; }
.hb .ic { position: relative; flex-shrink: 0; }
.hb img { width: 34px; height: 34px; border-radius: 50%; display: block; }
.hb.big img { width: 46px; height: 46px; }
.hb.sm img { width: 28px; height: 28px; }
.hb b { font-size: 14px; white-space: nowrap; }
.hb.used { opacity: .35; text-decoration: line-through; }
/* 一覧の行では、札の幅をそろえて説明と重ならないようにする */
.list > li > .hb { flex: 0 0 7.6em; align-items: flex-start; }
.list > li > .hb b { white-space: normal; line-height: 1.35; display: block; padding-top: 2px; }
.list > li > .hb small { display: block; }
.list .why { flex: 1; min-width: 0; }
h3.sub { font-size: 13px; color: var(--muted); margin: 10px 0 2px; }
.tier { position: absolute; right: -4px; bottom: -3px; min-width: 16px; height: 16px; border-radius: 5px; color: #fff; font-size: 10px; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center; padding: 0 3px; border: 1.5px solid var(--surface); line-height: 1; }
.tier.S { background: var(--tS); } .tier.A { background: var(--tA); } .tier.B { background: var(--tB); } .tier.C { background: var(--tC); } .tier.D { background: var(--tD); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.chip { font-size: 11.5px; line-height: 1.4; padding: 1px 7px; border-radius: 999px; background: var(--row); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.st { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-right: 2px; }
.st.team { background: var(--team); } .st.proposal { background: var(--proposal); } .st.data { background: var(--data); }
.stlab { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; white-space: nowrap; }
.stlab.team { background: var(--team-soft); color: var(--team); } .stlab.proposal { background: var(--proposal-soft); color: var(--proposal); } .stlab.data { background: var(--data-soft); color: var(--data); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }

/* おすすめ（レーンごと） */
.lane-row { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; }
.lane-row:first-of-type { border-top: 0; }
.lane-row .lane { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 10px; }
.lane-row .lane small { display: block; font-weight: 400; font-size: 11px; }
.best { display: flex; gap: 8px; align-items: flex-start; }
.best .body { min-width: 0; }
.others { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; }
.filled-row .best b { color: var(--muted); }

/* 型 */
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.type { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); text-align: left; cursor: pointer; }
.type[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.type b { display: block; font-size: 13.5px; }
.type .state { font-size: 11.5px; font-weight: 700; }
.type .state.on { color: var(--good); } .type .state.open { color: var(--data); } .type .state.broken { color: var(--muted); text-decoration: line-through; }
.type .core { display: flex; gap: 2px; margin-top: 4px; }
.type .core img { width: 24px; height: 24px; border-radius: 50%; }
.type .core img.gone { filter: grayscale(1); opacity: .35; }
.type-detail { margin-top: 10px; font-size: 14px; }
.type-detail ul { margin: 6px 0; padding-left: 1.2em; }
.type-detail li { margin: 2px 0; }

/* 一覧（リスト） */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.list .why { font-size: 13px; color: var(--text); }
.list .why small { color: var(--muted); }
.warn { background: var(--bad-soft); color: var(--text); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 14px; }
.warn b { color: var(--bad); }

/* ヒーロー一覧 */
.picker .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.picker input[type="search"] { flex: 1; min-width: 9em; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); font: inherit; font-size: 16px; }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 10px 4px; }
.pool button { border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.pool button img { width: 44px; height: 44px; border-radius: 50%; }
.pool button span.n { font-size: 11px; line-height: 1.25; text-align: center; overflow-wrap: anywhere; }
.pool button:disabled { cursor: default; opacity: .28; }
.pool button:focus-visible, .hb:focus-visible, .slot:focus-visible, .type:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* ヒーローの詳細 */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.sheet { padding: 14px 16px 16px; }
.sheet header { display: flex; gap: 10px; align-items: center; }
.sheet header img { width: 56px; height: 56px; border-radius: 50%; }
.sheet h3 { margin: 0; font-size: 19px; }
.sheet h4 { font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
.sheet .nums { font-size: 13px; color: var(--muted); }
.sheet .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.sheet .close { margin-left: auto; align-self: flex-start; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 3.2em; gap: 6px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; background: var(--row); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { height: 100%; background: var(--good); }
.bar .fill.low { background: var(--bad); }
footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
@media (max-width: 640px) {
  .wrap { padding: 0 12px 40px; }
  header.hero { padding-top: 18px; }
  .slot { width: 34px; height: 34px; }
  .slots.bans .slot { width: 26px; height: 26px; }
  .slots { gap: 3px; }
}
@media (max-width: 380px) {
  .slot { width: 30px; height: 30px; }
  .slots.bans .slot { width: 23px; height: 23px; }
}
</style>
</head>

    <input type="password" id="gate-pass" class="gate-input" aria-label="合言葉" autocomplete="current-password" required>
    <button type="submit" class="gate-btn" id="gate-btn">開く</button>
    <p class="gate-msg" id="gate-msg" aria-live="polite"></p>

</div>
<style>
.gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.gate[hidden] { display: none; }
.gate-box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.gate-kicker { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 12px; }
.gate-title { font-size: 22px; margin: 4px 0 8px; }
.gate-text { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.gate-input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
.gate-btn { width: 100%; margin: 10px 0 0; font: inherit; font-weight: 700; padding: 10px; min-height: 44px; border: 0; border-radius: 8px;
  background: var(--accent); color: #fff; cursor: pointer; }
.gate-btn:disabled { opacity: .6; }
.gate-input:focus-visible, .gate-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gate-msg { color: var(--accent); font-size: 14px; font-weight: 700; min-height: 1.5em; margin: 10px 0 0; }
</style>

  var gate = document.getElementById('gate');
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function open(pass) {

      show(new TextDecoder().decode(plain));
    });
  }
  function show(body) {
    document.body.removeAttribute('data-sealed');
    document.body.innerHTML = body;
    // innerHTML で入れた script は動かないので、作り直して動かす
    Array.prototype.forEach.call(document.body.querySelectorAll('script'), function (old) {
      var s = document.createElement('script');
      Array.prototype.forEach.call(old.attributes, function (a) { s.setAttribute(a.name, a.value); });
      s.text = old.text;
      old.parentNode.replaceChild(s, old);

    if (location.hash) {
      var t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (t) t.scrollIntoView();
    }
  }

    btn.disabled = true; msg.textContent = '';
    open(document.getElementById('gate-pass').value).catch(function (err) {

      msg.textContent = err && err.message === 'nocrypto' ? 'このブラウザでは開けません（https で開いてください）。' : '合言葉が違います。';
